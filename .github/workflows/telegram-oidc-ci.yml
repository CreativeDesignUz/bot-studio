name: Telegram OIDC Staging CI
on:
  push:
    branches:
      - fix/telegram-oidc-login-20261011
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: TypeScript, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit --incremental false
      - run: npm run lint
      - run: npm test
      - run: npm run build
