name: Bot Studio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit --incremental false

      - name: ESLint
        run: npm run lint

      - name: Security and regression QA tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high --omit=dev

  deploy-staging:
    name: Deploy Cloudflare staging
    needs: quality
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/checkout-security-foundation-20261012' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKENS }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm

      - name: Confirm deployment credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID GitHub secret is missing"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN GitHub secret is missing"; exit 1; }

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Deploy only staging Worker
        run: npx wrangler deploy --config dist/server/wrangler.json --name bot-studio-staging --keep-vars

      - name: Smoke test selected bot API (unauthenticated)
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bot-studio-staging.slavnauz.workers.dev"
          BOT="39237fdd-ec5d-415e-8634-e20c1d66edd1"
          for attempt in 1 2 3 4 5; do
            STATUS=$(curl --silent --show-error --location --output /tmp/botstudio-smoke.json --write-out '%{http_code}' "$BASE/api/miniapp/design?bot=$BOT" || true)
            if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
              echo "PASS: valid bot ID reached authentication guard (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $attempt: unexpected status $STATUS"
            sleep 3
          done
          echo "::error::Mini App design API did not reach authorization guard with known valid bot ID"
          exit 1
