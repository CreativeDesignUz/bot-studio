name: Bot Studio CI

on:
  pull_request:
  push:
    branches: [main, fix/p0-telegram-webhook-validation-20261011, chore/cloudflare-staging-20261011, fix/telegram-oidc-login-20261011]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit --incremental false

      - name: ESLint
        run: npm run lint

      - name: Automated tests
        run: npm test

      - name: Production build
        run: npm run build

  staging-e2e:
    name: Cloudflare staging E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run staging smoke tests
        env:
          E2E_BASE_URL: https://bot-studio-staging.slavnauz.workers.dev
        run: npm run test:e2e
